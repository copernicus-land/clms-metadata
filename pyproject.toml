[project]
name = "clms-metadata"
version = "0.0.1"
authors = [{name = "Stijn Caerts", email = "stijn.caerts@vito.be"}]
dependencies = [
    "cyclopts~=3.0.0",
    "autoregistry~=1.1.2",
    "pydantic~=2.9.2",
    "pydantic-settings~=2.5.2",
    "pyyaml==6.0.2",
    "ciso8601~=2.3.1",
    "loguru~=0.7.2",
    "shapely~=2.0.6",
    "geojson-pydantic~=1.1.1",
    "jinja2~=3.1.4",
    "yarl~=1.14.0",
    "overrides~=7.7.0",
    "boto3~=1.35.37",
    "cloudpathlib~=0.19.0",
    "opensearch-py~=2.7.1",
    "rioxarray==0.18.1",
    "cftime~=1.6.4",
]

[project.scripts]
"clms-metadata" = "clms_metadata.__main__:app"

[project.optional-dependencies]
dev = [
    "pre-commit",
    "ruff",
    "pytest",
]

[tool.setuptools.packages.find]
include = ["clms_metadata*"]

[tool.setuptools.package-data]
clms_metadata = ["resources/**"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I"]
[project]
name = "clms-metadata"
version = "1.2.7"
authors = [{name = "Stijn Caerts", email = "stijn.caerts@vito.be"}]
dependencies = [
    "cyclopts~=3.4.0",
    "autoregistry~=1.1.2",
    "pydantic~=2.10.6",
    "pydantic-settings~=2.7.1",
    "pyyaml==6.0.2",
    "ciso8601~=2.3.1",
    "loguru~=0.7.2",
    "shapely~=2.1.0",
    "geojson-pydantic~=1.2.0",
    "jinja2~=3.1.4",
    "overrides~=7.7.0",
    "boto3~=1.35.37",
    "cloudpathlib~=0.20.0",
    "opensearch-py~=2.8.0",
    "rioxarray==0.18.2",
    "cftime~=1.6.4",
    "platformdirs~=4.3.6",
]

[project.scripts]
"clms-metadata" = "clms_metadata.__main__:main"

[project.optional-dependencies]
dev = [
    "pre-commit",
    "ruff",
    "pytest",
    "pyjson5"
]
docs = [
    "sphinx~=8.1.3",
    "myst-parser~=4.0.0",
    "furo~=2024.8.6",
    "autodoc-pydantic~=2.2.0",
    "sphinx-autobuild~=2024.10.03",
]

[tool.setuptools.packages.find]
include = ["clms_metadata*"]

[tool.setuptools.package-data]
clms_metadata = ["resources/**"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I"]
templates:
  datasetIdentifier: "clms_vlcc_{name}_{spatialExtent}_{projection}_{gridLabel}_{temporalRepeatRate}_v{datasetVersion}"
  datasetAlias: "clms_vlcc_{name}"
fileRegex:
  - regex: "CLMS_HRLVLCC_{fileKey}_.*_R(?P<gridLabel>(?P<metricGridSpacing>\\d+)m)_(E|W)\\d{{2}}(N|S)\\d{{2}}_03035_V\\d{{2}}_R\\d{{2}}"
    spatialExtent: "europe"
    projection: "laea"
  - regex: "CLMS_HRLVLCC_{fileKey}_.*_R(?P<gridLabel>(\\d+)m)_[A-Z]+_\\d{{5}}_V\\d{{2}}_R\\d{{2}}"
    spatialExtent: "dom"
    projection: "utm"

# global properties for VLCC
temporalRepeatRate: "yearly"
name_suffix:

datasetMapping:
  - component: landcover_landuse
    productTypes:
      - productType: crop_types
        datasets:
          - name: crop-types
            datasetShortName: cty
            fileKey: CTY
            SDIResourceIdentifier: copernicus_r_3035_10_m_cty_p_2017-now_v01_r00
      - productType: cropping_patterns
        datasets:
          - name: fallow-land-presence
            datasetShortName: cpflp
            fileKey: CPFLP
            SDIResourceIdentifier: copernicus_r_3035_10_m_cpflp_p_2017-now_v01_r00
          - name: main-crop-duration
            datasetShortName: cpmcd
            fileKey: CPMCD
            SDIResourceIdentifier: copernicus_r_3035_10_m_cpmcd_p_2017-now_v01_r00
      - productType: dominant_leaf_type
        datasets:
          - name: dominant-leaf-type
            SDIResourceIdentifier: copernicus_r_3035_10_m_dlt_p_2018-now_v01_r00
            datasetShortName: dlt
            fileKey: DLT
      - productType: forest_type
        datasets:
          - name: forest-additional-support-layer
            temporalRepeatRate: 3yearly
            SDIResourceIdentifier: copernicus_r_3035_10_m_fadsl-2018-2021_p_2018-2021_v01_r00
            datasetShortName: fadsl
            fileKey: FADSL
      - productType: grassland_and_herbaceous
        datasets:
          - name: grassland
            datasetShortName: gra
            fileKey: GRA
            templates:
              SDIResourceIdentifier: copernicus_r_3035_{metricGridSpacing}_m_gra_p_2017-now_v01_r00
      - productType: grassland_mowing_events
        datasets:
          - name: grassland-mowing-dates
            SDIResourceIdentifier: copernicus_r_3035_10_m_gramd_p_2017-now_v01_r00
            datasetShortName: gramd
            fileKey: GRAMD\d
      - productType: tree_cover_density
        datasets:
          - name: tree-cover-presence-change
            temporalRepeatRate: 3yearly
            SDIResourceIdentifier: copernicus_r_3035_20_m_tcpc-2018-2021_p_2018-2021_v01_r00
            datasetShortName: tcpc
            fileKey: TCPC


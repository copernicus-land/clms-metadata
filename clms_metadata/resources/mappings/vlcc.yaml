templates:
  datasetIdentifier: "clms_vlcc_{name}_{areaOfInterest}_{gridLabel}_{temporalRepeatRate}_v{datasetVersion}"
  datasetAlias: "clms_vlcc_{name}"
fileRegex:
  - regex: "CLMS_HRLVLCC_{fileKey}_.*_R(?P<gridLabel>(?P<metricGridSpacing>\\d+)m)_(?P<tile>(E|W)\\d{{2}}(N|S)\\d{{2}})_03035_V\\d{{2}}_R\\d{{2}}"
#    spatialExtent: "europe"
    projection: "laea"
    templates:
      cellID: "100km{tile}"
  - regex: "CLMS_HRLVLCC_{fileKey}_.*_R(?P<gridLabel>(?P<metricGridSpacing>\\d+)m)_(?P<cellID>[A-Z]+_\\d{{5}})_V\\d{{2}}_R\\d{{2}}"
#    spatialExtent: "dom"
    projection: "utm"

# global properties for VLCC
temporalRepeatRate: "yearly"
name_suffix:  # no suffix
areaOfInterest: "europe"
datasetVersion: 1  # WARNING: pins all VLCC dataset versions to 1

datasetMapping:
  - component: landcover_landuse
    productTypes:
      - productType: crop_types
        datasets:
          - name: crop-types
            datasetShortName: cty
            fileKey: CTY
            SDIResourceIdentifier: copernicus_r_3035_10_m_cty_p_2017-now_v01_r00
          - name: crop-types-confidence-layer
            datasetShortName: ctycl
            fileKey: CTYCL

      - productType: cropping_patterns
        datasets:
          - name: bare-soil-after
            datasetShortName: cpbsa
            fileKey: CPBSA
            SDIResourceIdentifier: copernicus_r_3035_10_m_cpbsa_p_2017-now_v01_r00
          - name: bare-soil-after-confidence-layer
            datasetShortName: cpbsacl
            fileKey: CPBSACL
          - name: bare-soil-before
            fileKey: CPBSB
            datasetShortName: cpbsb
            SDIResourceIdentifier: copernicus_r_3035_10_m_cpbsb_p_2017-now_v01_r00
          - name: bare-soil-before-confidence-layer
            fileKey: CPBSBCL
            datasetShortName: cpbsbcl
          - name: cropping-seasons-types
            fileKey: CPCST
            datasetShortName: cpcst
            SDIResourceIdentifier: copernicus_r_3035_10_m_cpcst-2019-2021_p_2019-2021_v01_r00
          - name: cropping-seasons
            fileKey: CPCSY
            datasetShortName: cpcsy
            SDIResourceIdentifier: copernicus_r_3035_10_m_cpcsy_p_2017-now_v01_r00
          - name: fallow-land-duration
            fileKey: CPFLD
            datasetShortName: cpfld
            SDIResourceIdentifier: copernicus_r_3035_10_m_cpfld-2017-2021_p_2017-2021_v01_r00
          - name: fallow-land-duration-confidence-layer
            fileKey: CPFLDCL
            datasetShortName: cpfldcl
          - name: fallow-land-presence
            datasetShortName: cpflp
            fileKey: CPFLP
            SDIResourceIdentifier: copernicus_r_3035_10_m_cpflp_p_2017-now_v01_r00
          - name: fallow-land-presence-confidence-layer
            fileKey: CPFLPCL
            datasetShortName: cpflpcl
          - name: main-crop-duration
            datasetShortName: cpmcd
            fileKey: CPMCD
            SDIResourceIdentifier: copernicus_r_3035_10_m_cpmcd_p_2017-now_v01_r00
          - name: main-crop-duration-confidence-layer
            fileKey: CPMCDCL
            datasetShortName: cpmcdcl
          - name: main-crop-emergence
            fileKey: CPMCE
            datasetShortName: cpmce
            SDIResourceIdentifier: copernicus_r_3035_10_m_cpmce_p_2017-now_v01_r00
          - name: main-crop-emergence-confidence-layer
            fileKey: CPMCECL
            datasetShortName: cpmcecl
          - name: main-crop-harvest
            fileKey: CPMCH
            datasetShortName: cpmch
            SDIResourceIdentifier: copernicus_r_3035_10_m_cpmch_p_2017-now_v01_r00
          - name: main-crop-harvest-confidence-layer
            fileKey: CPMCHCL
            datasetShortName: cpmchcl
          - name: secondary-crop-duration
            fileKey: CPSCD
            datasetShortName: cpscd
            SDIResourceIdentifier: copernicus_r_3035_10_m_cpscd_p_2017-now_v01_r00
          - name: secondary-crop-duration-confidence-layer
            fileKey: CPSCDCL
            datasetShortName: cpscdcl
          - name: secondary-crop-emergence
            fileKey: CPSCE
            datasetShortName: cpsce
            SDIResourceIdentifier: copernicus_r_3035_10_m_cpsce_p_2017-now_v01_r00
          - name: secondary-crop-types
            fileKey: CPSCT
            datasetShortName: cpsct
            SDIResourceIdentifier: copernicus_r_3035_10_m_cpsct_p_2017-now_v01_r00

      - productType: dominant_leaf_type
        datasets:
          - name: dominant-leaf-type
            SDIResourceIdentifier: copernicus_r_3035_10_m_dlt_p_2018-now_v01_r00
            datasetShortName: dlt
            fileKey: DLT
          - name: dominant-leaf-type-confidence-layer
            fileKey: DLTCL
            datasetShortName: dltcl
          - name: dominant-leaf-type-change
            temporalRepeatRate: 3yearly
            fileKey: DLTC
            datasetShortName: dltc
            SDIResourceIdentifier: copernicus_r_3035_20_m_dltc-2018-2021_p_2018-2021_v01_r00
          - name: broadleaved-cover-density
            fileKey: BCD
            datasetShortName: bcd
            SDIResourceIdentifier: copernicus_r_3035_100_m_bcd_p_2018-now_v01_r00
          - name: coniferous-cover-density
            fileKey: CCD
            datasetShortName: ccd
            SDIResourceIdentifier: copernicus_r_3035_100_m_ccd_p_2018-now_v01_r00

      - productType: forest_type
        datasets:
          - name: forest-additional-support-layer
            temporalRepeatRate: 3yearly
            SDIResourceIdentifier: copernicus_r_3035_10_m_fadsl-2018-2021_p_2018-2021_v01_r00
            datasetShortName: fadsl
            fileKey: FADSL
          - name: forest-type
            temporalRepeatRate: 3yearly
            fileKey: FTY
            datasetShortName: fty
            templates:
              SDIResourceIdentifier: copernicus_r_3035_{metricGridSpacing}_m_fty-2018-2021_p_2018-2021_v01_r00

      - productType: grassland_and_herbaceous
        datasets:
          - name: grassland
            datasetShortName: gra
            fileKey: GRA
            templates:
              SDIResourceIdentifier: copernicus_r_3035_{metricGridSpacing}_m_gra_p_2017-now_v01_r00
          - name: grassland-confidence-layer
            fileKey: GRACL
            datasetShortName: gracl
          - name: grassland-change
            temporalRepeatRate: 3yearly
            SDIResourceIdentifier: copernicus_r_3035_20_m_grac-2018-2021_p_2018-2021_v01_r00
            fileKey: GRAC
            datasetShortName: grac
          - name: grassland-change-confidence-layer
            temporalRepeatRate: 3yearly
            fileKey: GRACCL
            datasetShortName: graccl
          - name: herbaceous-cover
            fileKey: HER
            datasetShortName: her
            SDIResourceIdentifier: copernicus_r_3035_10_m_her_p_2017-now_v01_r00
          - name: ploughing-indicator
            fileKey: PLOUGH
            datasetShortName: plough
            SDIResourceIdentifier: copernicus_r_3035_10_m_plough_p_2017-now_v01_r00

      - productType: grassland_mowing_events
        datasets:
          - name: grassland-mowing-dates
            SDIResourceIdentifier: copernicus_r_3035_10_m_gramd_p_2017-now_v01_r00
            datasetShortName: gramd
            fileKey: GRAMD\d
          - name: grassland-mowing-events
            SDIResourceIdentifier: copernicus_r_3035_10_m_grame_p_2017-now_v01_r00
            datasetShortName: grame
            fileKey: GRAME
          - name: grassland-mowing-events-confidence-layer
            fileKey: GRAMECL
            datasetShortName: gramecl

      - productType: tree_cover_density
        datasets:
          - name: tree-cover-density
            fileKey: TCD
            datasetShortName: tcd
            templates:
              SDIResourceIdentifier: copernicus_r_3035_{metricGridSpacing}_m_tcd_p_2018-now_v01_r00
          - name: tree-cover-density-confidence-layer
            fileKey: TCDCL
            datasetShortName: tcdcl
          - name: tree-cover-presence-change
            temporalRepeatRate: 3yearly
            SDIResourceIdentifier: copernicus_r_3035_20_m_tcpc-2018-2021_p_2018-2021_v01_r00
            datasetShortName: tcpc
            fileKey: TCPC
          - name: tree-cover-presence-change-confidence-layer
            temporalRepeatRate: 3yearly
            fileKey: TCPCCL
            datasetShortName: tcpccl

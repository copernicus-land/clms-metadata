templates:
  datasetIdentifier: "{name}_{areaOfInterest}_{gridLabel}_{temporalRepeatRate}_v{datasetVersion}"

areaOfInterest: global

datasetMapping:
  - component: bio-geophysical
    productTypes:
      - productType: vegetation_indices
        datasets:
          - name: ndvi
            gridLabel: 1km
            temporalRepeatRate: 10daily
            fileKey: NDVI
            fileRegex:
              - regex: "c_gls_{fileKey}(?:-(RT\\d))?_\\d{{12}}_[A-Z0-9-]+_[A-Z0-9-]+_V(?P<productVersion>(?P<datasetVersion>\\d)\\.\\d\\.\\d)"
          - name: ndvi
            gridLabel: 300m
            temporalRepeatRate: 10daily
            fileKey: NDVI300
            fileRegex:
              - regex: "c_gls_{fileKey}(?:-(RT\\d))?_\\d{{12}}_[A-Z0-9-]+_[A-Z0-9-]+_V(?P<productVersion>(?P<datasetVersion>\\d)\\.\\d\\.\\d)"
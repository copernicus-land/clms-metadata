templates:
  datasetIdentifier: "clms_ua_{name}_{areaOfInterest}_{gridLabel}_{temporalRepeatRate}_v{datasetVersion}"
  datasetAlias: "clms_ua_{name}"

fileRegex:
  - regex: "CLMS_UA_{fileKey}_.*_R(?P<gridLabel>(?P<metricGridSpacing>\\d+)m)_(?P<fuaCode>(?P<countryCode>[A-Z]{{2}})[A-Z0-9]+)_(?P<fuaName>\\w+)_03035_V\\d{{2}}_R\\d{{2}}_\\d{{8}}"
    templates:
      cellID: "{fuaCode}"
  - regex: "CLMS_UA_{fileKey}_.*_R(?P<gridLabel>(?P<metricGridSpacing>\\d+)m)_EURO_03857_V\\d{{2}}_R\\d{{2}}"

name_suffix: # no suffix
areaOfInterest: "europe"

datasetMapping:
  - component: "land_cover_use_in_priority_areas"
    productTypes:
      - productType: "urban_atlas"
        datasets:
          - name: "building-height"
            datasetVersion: 1
            temporalRepeatRate: "3yearly"
            datasetShortName: "ua-bbh"
            fileKey: BBH
            SDIResourceIdentifier: "copernicus_r_3035_10_m_ua-bh-2021_p_2021_v01_r00"
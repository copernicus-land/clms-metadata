templates:
  datasetIdentifier: "clms_vpp_{productTypeShort}-{name}_{areaOfInterest}_{projectionName}_{gridLabel}_{temporalRepeatRate}_v{datasetVersion}"
  datasetAlias: "clms_vpp_{productTypeShort}-{name}"
  datasetShortName: "vpp_{productTypeShort}-{name}"

# global properties
name_suffix:  # no suffix
areaOfInterest: "europe"
datasetVersion: 1  # WARNING: pins all HR-VPP dataset versions to 1



datasetMapping:
  - component: bio-geophysical
    productTypes:
      - productType: vegetation_seasonal_trajectories
        productTypeShort: st
        productTypeKey: ST
        temporalRepeatRate: "10daily"
        datasets:
          - name: ppi
            fileKey: PPI
            templates:
              product_name: "{product}_PPI"
            fileRegex:
              - regex: "(?P<product>{productTypeKey}_.+_T(?P<cellID>\\w{{5}})-010m_V\\d{{3}}(_s(?P<season>\\d)_)?)"
                metricGridSpacing: 10
                gridLabel: 10m
                projectionName: "utm"
                SDIResourceIdentifier: "copernicus_r_utm-wgs84_10_m_hrvpp-st-ppi_p_2017-now_v01_r01,copernicus_r_utm-wgs84_10_m_hrvpp-st-qflag_p_2017-now_v01_r01"
              - regex: "(?P<product>{productTypeKey}_.+_(?P<tile>(E|W)\\d{{2}}(N|S)\\d{{2}})-03035-0*(?P<gridLabel>(?P<metricGridSpacing>[1-9]\\d*)m)_V\\d{{3}}(_s(?P<season>\\d))?)"
                projectionName: "laea"
                SDIResourceIdentifier: "copernicus_r_3035_x_m_hrvpp-st-ppi_p_2017-now_v01_r05,copernicus_r_3035_x_m_hrvpp-st-qflag_p_2017-now_v01_r05"
                templates:
                  cellID: "100km{tile}"
              - regex: "(?P<product>{productTypeKey}_.+_eu-03035-0*(?P<gridLabel>(?P<metricGridSpacing>[1-9]\\d*)m)_V\\d{{3}}(_s(?P<season>\\d))?)"
                projectionName: "laea"
                SDIResourceIdentifier: "copernicus_r_3035_x_m_hrvpp-st-ppi_p_2017-now_v01_r05,copernicus_r_3035_x_m_hrvpp-st-qflag_p_2017-now_v01_r05"

      - productType: vegetation_phenology_and_productivity_parameters
        productTypeShort: vpp
        productTypeKey: VPP
        temporalRepeatRate: "yearly"
        fileRegex:
          - regex: "{productTypeKey}_.+_T(?P<cellID>\\w{{5}})-010m_V\\d{{3}}_(s(?P<season>\\d)_)?{fileKey}"
            metricGridSpacing: 10
            gridLabel: 10m
            projectionName: "utm"
            templates:
              SDIResourceIdentifier: copernicus_r_utm-wgs84_10_m_hrvpp-{productTypeShort}-{name}_p_2017-now_v01_r01
          - regex: "{productTypeKey}_.+_(?P<tile>(E|W)\\d{{2}}(N|S)\\d{{2}})-03035-0*(?P<gridLabel>(?P<metricGridSpacing>[1-9]\\d*)m)_V\\d{{3}}_(s(?P<season>\\d)_)?{fileKey}"
            projectionName: "laea"
            templates:
              SDIResourceIdentifier: copernicus_r_3035_x_m_hrvpp-{productTypeShort}-{name}_p_2017-now_v01_r05
              cellID: "100km{tile}"
          - regex: "{productTypeKey}_.+_eu-03035-0*(?P<gridLabel>(?P<metricGridSpacing>[1-9]\\d*)m)_V\\d{{3}}_(s(?P<season>\\d)_)?{fileKey}"
            projectionName: "laea"
            templates:
              SDIResourceIdentifier: copernicus_r_3035_x_m_hrvpp-{productTypeShort}-{name}_p_2017-now_v01_r05
        templates:
          vppSubParameter: "{fileKey}"
          vppSeason: "S{season}"
        datasets:
          - name: ampl
            fileKey: AMPL
          - name: eosd
            fileKey: EOSD
          - name: eosv
            fileKey: EOSV
          - name: length
            fileKey: LENGTH
          - name: lslope
            fileKey: LSLOPE
          - name: maxd
            fileKey: MAXD
          - name: maxv
            fileKey: MAXV
          - name: minv
            fileKey: MINV
          - name: qflag
            fileKey: QFLAG
          - name: rslope
            fileKey: RSLOPE
          - name: sosd
            fileKey: SOSD
          - name: sosv
            fileKey: SOSV
          - name: sprod
            fileKey: SPROD
          - name: tprod
            fileKey: TPROD
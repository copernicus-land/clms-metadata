fileRegex:
  - regex: "CLMS_CLCPLUS_{fileKey}_.*_R(?P<metricGridSpacing>\\d+)M_EUROPE_03035_V\\d{{2}}_R\\d{{2}}"
    templates:
      gridLabel: "{metricGridSpacing}m"
      datasetIdentifier: "clms_clcplus_{name}_{areaOfInterest}_{gridLabel}_{temporalRepeatRate}_v{datasetVersion}"
      datasetAlias: "clms_clcplus_{name}"


name_suffix:  # no suffix
areaOfInterest: "europe"

datasetMapping:
  - component: "landcover_landuse"
    productTypes:
      - productType: "clcplus_lulucf_instance"
        datasets:
          - name: "lulucf-instance"
            datasetVersion: 1
            temporalRepeatRate: "yearly"
            datasetShortName: "clcplus-lulucf-instance"
            fileKey: LULUCF_INSTANCE